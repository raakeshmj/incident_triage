apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # The simulated services' JSON log lines carry the active span's
      # trace_id (simulator/services/common/telemetry.py) -- turn it into a
      # clickable link to the same trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          datasourceUid: tempo
          url: "$${__value.raw}"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # And the reverse: from a span, jump to that service's log lines that
      # carry the same trace_id.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: '{service="$${__span.tags["service.name"]}"} |= "$${__trace.traceId}"'
