# Scrapes container stdout via the Docker socket -- the simulated services
# write structured JSON logs to stdout (simulator/services/common/telemetry.py);
# this is what turns those into Loki-queryable log streams, no
# application-side Loki client needed.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
    pipeline_stages:
      - json:
          expressions:
            severity: severity
            message: message
      - labels:
          severity:
