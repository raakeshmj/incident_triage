[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-intelligence"
version = "0.1.0"
description = "Autonomous Production Incident Triage & Response platform"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "redis>=5.0,<6.0",
    "structlog>=24.1,<25.0",
    "anthropic>=1.8,<2.0",
]

[project.scripts]
evaluate = "packages.evaluation.cli:evaluate_main"
replay = "packages.evaluation.cli:replay_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires local Postgres/Redis infrastructure (see Makefile infra-up)",
    "e2e: end-to-end tests requiring the full local stack",
    "stack: needs the full Phase 3/4 stack (`make infra-up-full`): Prometheus, Loki, Tempo, simulated services",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps", "packages", "tests", "simulator", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages", "tests", "simulator"]

[tool.mypy]
python_version = "3.11"
packages = ["apps", "packages"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["tests/", "simulator/", "scripts/"]
