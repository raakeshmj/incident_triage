# incident-core's schema (default section): `alembic upgrade head`
[alembic]
script_location = packages/incident/migrations
prepend_sys_path = .
version_path_separator = os

# evidence-service's schema, as its own role (Phase 4):
# `alembic -n evidence upgrade head`
[evidence]
script_location = packages/evidence/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
