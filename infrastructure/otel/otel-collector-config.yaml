# OTel Collector: receives traces (OTLP/HTTP+gRPC) from the 3 simulated
# services and exports them to Grafana Tempo (infrastructure/tempo/). Metrics
# are scraped by Prometheus directly from each service's own /metrics (see
# infrastructure/prometheus/prometheus.yml) -- the collector's job here is
# the trace pipeline only. See docs/architecture/14-observability-and-chaos.md.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
